# Full CI flow for the project
name: Continuous Integration

on:
  # master branch will not accept if any failed
  # development branch will accept regardless of the status of the jobs
  # pull_request: validate PR branch before merge (required for PR checks).
  # push: validate when commits land on protected branches (merge + direct push).
  # Omit pull_request "closed" so merge does not double-run with push to the same branch.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - development
      - main
  push:
    branches:
      - staging
      - development
      - main
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js environment
      - name: Set up Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # Fetch secrets (GH_PACKAGE_KEY) from Doppler learncraft-spanish/tst
      - name: Fetch secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      # Authenticate GitHub Packages (registry settings are in the committed .npmrc)
      - name: Write ~/.npmrc
        run: echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGE_KEY}" > ~/.npmrc

      # Install pnpm
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")" # exact version from package.json

      # Cache Node.js dependencies
      - name: Cache Node.js dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: cache-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cache-node-modules-

      # Install dependencies
      - name: Install dependencies
        run: pnpm install:ci

      # Run Prettier
      - name: Run Prettier
        run: pnpm run format:check

  typecheck:
