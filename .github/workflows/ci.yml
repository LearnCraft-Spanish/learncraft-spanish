      # Install pnpm
      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")" # exact version from package.json

      # Cache Node.js dependencies
      - name: Cache Node.js dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: cache-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cache-node-modules-

      # Install dependencies
      - name: Install dependencies
        run: pnpm install:ci

      # Run TypeCheck
      - name: Run Typecheck
        run: pnpm run typecheck

  lint:
